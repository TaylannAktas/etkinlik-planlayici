<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etkinlik Planlayıcı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="mode-switch">
      <button class="mode active" data-mode="ders">Ders Programı</button>
      <button class="mode" data-mode="sinav">Sınav Programı</button>
    </div>
    <button id="overlay-toggle" class="btn overlay-btn" aria-pressed="false" title="Ders ve sınav programını aynı takvimde göster">
      <span class="long">Üst üste göster</span><span class="short">Üst üste</span>
    </button>
    <h1>Etkinlik Planlayıcı</h1>
  </header>

  <main id="ders-mode" class="layout">
    <aside class="sidebar">
      <h2>Ders programları</h2>
      <ul id="program-list" class="item-list"></ul>
      <p id="empty-programs" class="muted">Henüz ders programı yok.</p>
      <button id="add-program" class="btn primary"><span class="long">+ Ders programı ekle</span><span class="short">+ Ekle</span></button>
    </aside>

    <section class="content">
      <div class="month-head">
        <button id="prev-month" class="btn icon" aria-label="Önceki ay">‹</button>
        <h2 id="month-title"></h2>
        <button id="next-month" class="btn icon" aria-label="Sonraki ay">›</button>
        <button id="today" class="btn">Bugün</button>
      </div>
      <div id="month-grid" class="month-grid"></div>
      <div class="day-view">
        <h3 id="day-title"></h3>
        <p id="day-empty" class="muted" hidden>Bu gün için ders yok.</p>
        <ul id="day-exams" class="day-list always day-exams"></ul>
        <div id="day-grid" class="day-grid"></div>
        <ul id="day-list" class="day-list"></ul>
      </div>
    </section>
  </main>

  <main id="sinav-mode" class="layout" hidden>
    <aside class="sidebar">
      <h2>Dersler</h2>
      <div class="row toggles">
        <button id="ex-all" class="btn small">Tümünü seç</button>
        <button id="ex-none" class="btn small">Temizle</button>
      </div>
      <ul id="exam-course-list" class="item-list"></ul>
    </aside>

    <section class="content">
      <div class="month-head">
        <button id="ex-prev" class="btn icon" aria-label="Önceki ay">‹</button>
        <h2 id="ex-month-title"></h2>
        <button id="ex-next" class="btn icon" aria-label="Sonraki ay">›</button>
        <button id="ex-today" class="btn">Bugün</button>
      </div>
      <div id="ex-month-grid" class="month-grid"></div>
      <div class="day-view">
        <h3 id="ex-day-title"></h3>
        <p id="ex-day-empty" class="muted" hidden></p>
        <ul id="ex-day-list" class="day-list always"></ul>
      </div>
      <p id="ex-source" class="muted source"></p>
    </section>
  </main>

  <div id="editor" class="overlay" hidden>
    <div class="editor">
      <div class="editor-head">
        <input id="program-name" placeholder="Program adı (ör. Bilgisayar Müh. 2. sınıf)">
        <input id="program-color" type="color" title="Program rengi">
        <span class="spacer"></span>
        <button id="delete-program" class="btn danger">Programı sil</button>
        <button id="cancel-edit" class="btn">Vazgeç</button>
        <button id="save-program" class="btn primary">Kaydet</button>
      </div>
      <div id="day-tabs" class="day-tabs"></div>
      <p id="hint" class="muted hint"></p>
      <div class="editor-body">
        <div id="week-grid" class="week-grid"></div>
        <form id="entry-form" class="entry-form" hidden>
          <strong id="entry-range"></strong>
          <label>Ders adı<input id="entry-name" required></label>
          <label>Derslik (isteğe bağlı)<input id="entry-room"></label>
          <label>Öğretim üyesi (isteğe bağlı)<input id="entry-teacher"></label>
          <div class="row">
            <button type="submit" id="entry-submit" class="btn primary">Ekle</button>
            <button type="button" id="entry-delete" class="btn danger">Sil</button>
            <button type="button" id="entry-cancel" class="btn">İptal</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="programlar.js"></script>
  <script src="sinavlar.js"></script>
  <script src="app.js"></script>
</body>
</html>
